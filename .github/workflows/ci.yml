name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendor_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendor_dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Generate Prisma Client
        # Frontend tests import backend enum-backed services, so generate Prisma before any build/test step.
        run: npm run backend:db:generate

      - name: Ensure PostgreSQL 16 client for baseline verification
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Validate fresh database bootstrap
        run: |
          PGPASSWORD=postgres createdb --host=127.0.0.1 --username=postgres vendor_dashboard_fresh_bootstrap
          npm run backend:db:bootstrap:fresh
          npm --prefix backend exec -- prisma migrate status --schema backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vendor_dashboard_fresh_bootstrap?schema=public

      - name: Verify PostgreSQL-native baseline catalog
        run: npm run backend:db:bootstrap:check
        env:
          BOOTSTRAP_REFRESH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
          PG16_BIN: /usr/lib/postgresql/16/bin

      - name: Test PostgreSQL advisory lock
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vendor_dashboard_test?schema=public

      - name: Test Financial Correction PostgreSQL suites
        run: |
          set -euo pipefail

          while read -r db gate file; do
            PGPASSWORD=postgres createdb \
              --host=127.0.0.1 \
              --username=postgres \
              --template=vendor_dashboard_fresh_bootstrap \
              "$db"

            url="postgresql://postgres:postgres@127.0.0.1:5432/$db?schema=public"
            report="$RUNNER_TEMP/$db-vitest.json"

            env "TEST_DATABASE_URL=$url" "$gate=1" \
              npm run test -- "$file" \
                --reporter=default \
                --reporter=json \
                --outputFile.json="$report"

            node -e '
              const r = require(process.argv[1]);
              const file = process.argv[2];
              if (!r.success || r.testResults.length !== 1 ||
                  !r.testResults[0].name.endsWith(file) ||
                  r.numPassedTests < 1 || r.numPendingTests !== 0 ||
                  r.numFailedTests !== 0) process.exit(1);
            ' "$report" "$file"
          done <<'SUITES'
          phase2c_bootstrap PHASE2C_TEST_DATABASE_ISOLATED src/financial-correction-paid-debt.postgres.test.ts
          phase2d_validation PHASE2D_TEST_DATABASE_ISOLATED src/financial-correction-paid-credit.postgres.test.ts
          phase2e1_validation PHASE2E1_TEST_DATABASE_ISOLATED src/financial-correction-before-settlement-credit.postgres.test.ts
          phase2e2_validation PHASE2E2_TEST_DATABASE_ISOLATED src/financial-correction-before-settlement-deduction.postgres.test.ts
          phase2e3a_validation PHASE2E3A_TEST_DATABASE_ISOLATED src/financial-correction-approved-settlement-credit.postgres.test.ts
          phase2e3b_validation PHASE2E3B_TEST_DATABASE_ISOLATED src/financial-correction-approved-settlement-deduction.postgres.test.ts
          phase2f1_validation PHASE2F1_TEST_DATABASE_ISOLATED src/financial-correction-draft-payout.postgres.test.ts
          phase2f2_validation PHASE2F2_TEST_DATABASE_ISOLATED src/financial-correction-review-payout.postgres.test.ts
          SUITES

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Backend build
        run: npm run backend:build

      - name: Backend typecheck
        run: npm run backend:typecheck

      - name: Backend smoke
        run: npm run backend:smoke
        env:
          SHIPPING_PROVIDER: kargonomi
          KARGONOMI_BASE_URL: https://app.kargonomi.com.tr/api/v1
          KARGONOMI_API_TOKEN: test-token

      - name: Real REVIEW financial correction browser smoke
        id: real_review_browser_smoke
        run: npm run smoke:browser:real
        env:
          BROWSER_SMOKE_ALLOW_LOCAL_DB: '1'
          BROWSER_SMOKE_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Upload real browser smoke failure artifacts
        if: failure() && steps.real_review_browser_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: financial-correction-review-browser-smoke
          path: test-results/
          if-no-files-found: warn
          retention-days: 3
