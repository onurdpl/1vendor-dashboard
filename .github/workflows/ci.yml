name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  postgres-18-finance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and generate Prisma Client
        run: |
          npm ci
          npm --prefix backend ci
          npm run backend:db:generate
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Verify PostgreSQL 18 canonical baseline
        run: npm run backend:db:bootstrap:check
        env:
          BOOTSTRAP_POSTGRES_MAJOR: '18'
          BOOTSTRAP_REFRESH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
          PG18_BIN: /usr/lib/postgresql/18/bin
      - name: Bootstrap PostgreSQL 18 test template
        run: |
          PGPASSWORD=postgres createdb --host=127.0.0.1 --username=postgres vendor_dashboard_pg18_bootstrap
          npm run backend:db:bootstrap:fresh
          npm --prefix backend exec -- prisma migrate status --schema backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vendor_dashboard_pg18_bootstrap?schema=public
      - name: Test isolated PostgreSQL 18 settlement provenance and finance authority
        run: |
          set -euo pipefail
          cleanup005b() {
            local outcome=$?
            trap - EXIT
            if [ "${created005b:-0}" = 1 ]; then
              local identity
              identity="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -XAt -v ON_ERROR_STOP=1 -c "SELECT pg_get_userbyid(datdba) || '|' || (pg_control_system()).system_identifier::text || '|' || shobj_description(oid, 'pg_database') FROM pg_database WHERE datname='fin_paid_cancel_005b_validation'")" || exit 1
              if [ "$identity" != "postgres|$cluster|fin-auto-ci:$proof" ]; then
                echo '005B cleanup identity/proof mismatch; refusing deletion.'
                exit 1
              fi
              PGPASSWORD=postgres dropdb -h 127.0.0.1 -U postgres fin_paid_cancel_005b_validation || exit 1
              local remaining
              remaining="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_database WHERE datname='fin_paid_cancel_005b_validation'")" || exit 1
              [ "$remaining" = 0 ] || exit 1
              echo '005B cleanup verified: disposable database absent.'
            fi
            return "$outcome"
          }
          while read -r db gate file; do
            if [ "$db" = fin_paid_cancel_005b_validation ]; then
              created005b=0
              trap cleanup005b EXIT
            fi
            PGPASSWORD=postgres createdb --host=127.0.0.1 --username=postgres \
              --template=vendor_dashboard_pg18_bootstrap "$db"
            if [ "$db" = fin_paid_cancel_005b_validation ]; then created005b=1; fi
            url="postgresql://postgres:postgres@127.0.0.1:5432/$db?schema=public"
            report="$RUNNER_TEMP/$db-pg18-vitest.json"
            proof=""
            cluster=""
            a2Env=()
            case "$db" in
              fin_auto_f03f04_ci_validation|fin_auto_f06_ci_validation|admin_password_reset_ci_validation|a2_vendor_directory_ci_validation|fin_paid_cancel_005b_validation)
                proof="$(openssl rand -hex 32)"
                cluster="$(PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=postgres --no-psqlrc --tuples-only --no-align --command='SELECT system_identifier FROM pg_control_system()')"
                PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=postgres --no-psqlrc --set=ON_ERROR_STOP=1 \
                  --command="COMMENT ON DATABASE \"$db\" IS 'fin-auto-ci:$proof'"
                ;;
            esac
            if [ "$db" = a2_vendor_directory_ci_validation ]; then a2Env=("A2_DIRECTORY_CI_MODE=1"); fi
            env "TEST_DATABASE_URL=$url" "DATABASE_URL=$url" "$gate=1" "${a2Env[@]}" "FIN_AUTO_CI_DB_PROOF=$proof" \
              "FIN_AUTO_CI_CLUSTER_ID=$cluster" "FIN_AUTO_CI_PG_MAJOR=18" npm run test -- "$file" \
              --reporter=default --reporter=json --outputFile.json="$report"
            node -e '
              const r = require(process.argv[1]);
              const file = process.argv[2];
              if (!r.success || r.testResults.length !== 1 ||
                  !r.testResults[0].name.endsWith(file) ||
                  r.numPassedTests < 1 || r.numPendingTests !== 0 ||
                  r.numFailedTests !== 0) process.exit(1);
              if (file === "src/vendor-directory.postgres.test.ts") {
                const expected = [
                  "returns all 523 Vendors through bounded default pages with preserved DTO fields",
                  "orders updatedAt, createdAt and Vendor.id deterministically across cursor boundaries",
                  "paginates search and status filters without duplicates or omissions",
                  "validates cursor and filter context with HTTP 400 and ends with no next cursor",
                  "enforces real authentication and Admin-only directory access",
                ];
                const assertions = r.testResults[0].assertionResults;
                if (r.numPassedTests !== expected.length || !Array.isArray(assertions) ||
                    assertions.length !== expected.length ||
                    !expected.every((title) => assertions.some((test) => test.title === title && test.status === "passed"))) process.exit(1);
              }
              if (file === "src/fin-paid-cancel-005b.postgres.test.ts") {
                const assertions = r.testResults[0].assertionResults;
                if (r.numTotalTests !== 25 || r.numPassedTests !== 25 ||
                    !Array.isArray(assertions) || assertions.length !== 25 ||
                    assertions.some((test) => test.status !== "passed")) process.exit(1);
                console.log("005B verified: 25 PASS / 0 FAIL / 0 SKIPPED / 0 PENDING");
              }
            ' "$report" "$file"
            if [ "$db" = fin_paid_cancel_005b_validation ]; then
              cleanup005b
              trap - EXIT
            fi
          done <<'SUITES'
          settlement_utc_boundary_validation SETTLEMENT_UTC_BOUNDARY_TEST_DATABASE_ISOLATED src/settlement-schedule-utc-boundary.postgres.test.ts
          settlement_approval_readiness_validation SETTLEMENT_APPROVAL_READINESS_TEST_DATABASE_ISOLATED src/settlement-approval-readiness.postgres.test.ts
          fin_bug_002_validation FIN_BUG_002_TEST_DATABASE_ISOLATED src/fin-bug-002-cancelled-cycle.postgres.test.ts
          phase2e1_validation PHASE2E1_TEST_DATABASE_ISOLATED src/financial-correction-before-settlement-credit.postgres.test.ts
          phase2e2_validation PHASE2E2_TEST_DATABASE_ISOLATED src/financial-correction-before-settlement-deduction.postgres.test.ts
          fin_bug_005_validation FIN_BUG_005_TEST_DATABASE_ISOLATED src/fin-bug-005-settlement-preview-isolation.postgres.test.ts
          settlement_job_2c_validation SETTLEMENT_JOB_2C_TEST_DATABASE_ISOLATED src/settlement-job-evidence.postgres.test.ts
          settlement_job_concurrency_validation SETTLEMENT_JOB_CONCURRENCY_TEST_DATABASE_ISOLATED src/settlement-job-multi-worker.postgres.test.ts
          fin_auto_f03f04_ci_validation FIN_AUTO_P4_TEST_DATABASE_ISOLATED src/fin-auto-f03-f04-security.postgres.test.ts
          fin_auto_f06_ci_validation FIN_AUTO_F06_TEST_DATABASE_ISOLATED src/fin-auto-f06-crash-recovery.postgres.test.ts
          admin_password_reset_ci_validation ADMIN_PASSWORD_RESET_TEST_DATABASE_ISOLATED src/vendor-password-reset.postgres.test.ts
          r1_phase1_validation R1_PHASE1_TEST_DATABASE_ISOLATED src/r1-payout-offset-authority.postgres.test.ts
          a2_vendor_directory_ci_validation A2_DIRECTORY_PG_ISOLATED src/vendor-directory.postgres.test.ts
          fin_paid_cancel_005b_validation FIN_PAID_CANCEL_005B_TEST_DATABASE_ISOLATED src/fin-paid-cancel-005b.postgres.test.ts
          SUITES

  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendor_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendor_dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend without backend dependencies
        run: npm run build

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Generate Prisma Client
        # Frontend tests import backend enum-backed services, so generate Prisma before any build/test step.
        run: npm run backend:db:generate

      - name: Ensure PostgreSQL 16 client for baseline verification
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Validate fresh database bootstrap
        run: |
          PGPASSWORD=postgres createdb --host=127.0.0.1 --username=postgres vendor_dashboard_fresh_bootstrap
          npm run backend:db:bootstrap:fresh
          npm --prefix backend exec -- prisma migrate status --schema backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vendor_dashboard_fresh_bootstrap?schema=public

      - name: Verify PostgreSQL-native baseline catalog
        run: npm run backend:db:bootstrap:check
        env:
          BOOTSTRAP_REFRESH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
          PG16_BIN: /usr/lib/postgresql/16/bin

      - name: Test PostgreSQL advisory lock
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vendor_dashboard_test?schema=public

      - name: Test isolated finance and Sopyo PostgreSQL suites
        run: |
          set -euo pipefail

          while read -r db gate file; do
            PGPASSWORD=postgres createdb \
              --host=127.0.0.1 \
              --username=postgres \
              --template=vendor_dashboard_fresh_bootstrap \
              "$db"

            url="postgresql://postgres:postgres@127.0.0.1:5432/$db?schema=public"
            report="$RUNNER_TEMP/$db-vitest.json"
            proof=""
            cluster=""
            case "$db" in
              fin_auto_f03f04_ci_validation|fin_auto_f06_ci_validation|admin_password_reset_ci_validation)
                proof="$(openssl rand -hex 32)"
                cluster="$(PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=postgres --no-psqlrc --tuples-only --no-align --command='SELECT system_identifier FROM pg_control_system()')"
                PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=postgres --no-psqlrc --set=ON_ERROR_STOP=1 \
                  --command="COMMENT ON DATABASE \"$db\" IS 'fin-auto-ci:$proof'"
                ;;
            esac

            env "TEST_DATABASE_URL=$url" "DATABASE_URL=$url" "$gate=1" "FIN_AUTO_CI_DB_PROOF=$proof" \
              "FIN_AUTO_CI_CLUSTER_ID=$cluster" "FIN_AUTO_CI_PG_MAJOR=16" \
              npm run test -- "$file" \
                --reporter=default \
                --reporter=json \
                --outputFile.json="$report"

            node -e '
              const r = require(process.argv[1]);
              const file = process.argv[2];
              if (!r.success || r.testResults.length !== 1 ||
                  !r.testResults[0].name.endsWith(file) ||
                  r.numPassedTests < 1 || r.numPendingTests !== 0 ||
                  r.numFailedTests !== 0) process.exit(1);
            ' "$report" "$file"
          done <<'SUITES'
          fin_bug_001_validation FIN_BUG_001_TEST_DATABASE_ISOLATED src/fin-bug-001-settlement-delay-parity.postgres.test.ts
          fin_bug_002_validation FIN_BUG_002_TEST_DATABASE_ISOLATED src/fin-bug-002-cancelled-cycle.postgres.test.ts
          fin_bug_005_validation FIN_BUG_005_TEST_DATABASE_ISOLATED src/fin-bug-005-settlement-preview-isolation.postgres.test.ts
          settlement_approval_readiness_validation SETTLEMENT_APPROVAL_READINESS_TEST_DATABASE_ISOLATED src/settlement-approval-readiness.postgres.test.ts
          r1_phase1_validation R1_PHASE1_TEST_DATABASE_ISOLATED src/r1-payout-offset-authority.postgres.test.ts
          r1_phase2_validation R1_PHASE2_TEST_DATABASE_ISOLATED src/r1-payout-offset-reservation.postgres.test.ts
          settlement_utc_boundary_validation SETTLEMENT_UTC_BOUNDARY_TEST_DATABASE_ISOLATED src/settlement-schedule-utc-boundary.postgres.test.ts
          settlement_job_2c_validation SETTLEMENT_JOB_2C_TEST_DATABASE_ISOLATED src/settlement-job-evidence.postgres.test.ts
          settlement_job_http_validation SETTLEMENT_JOB_HTTP_TEST_DATABASE_ISOLATED src/settlement-job-admin-http.postgres.test.ts
          settlement_job_concurrency_validation SETTLEMENT_JOB_CONCURRENCY_TEST_DATABASE_ISOLATED src/settlement-job-multi-worker.postgres.test.ts
          fin_auto_f03f04_ci_validation FIN_AUTO_P4_TEST_DATABASE_ISOLATED src/fin-auto-f03-f04-security.postgres.test.ts
          fin_auto_f06_ci_validation FIN_AUTO_F06_TEST_DATABASE_ISOLATED src/fin-auto-f06-crash-recovery.postgres.test.ts
          admin_password_reset_ci_validation ADMIN_PASSWORD_RESET_TEST_DATABASE_ISOLATED src/vendor-password-reset.postgres.test.ts
          settlement_job_failure_validation SETTLEMENT_JOB_FAILURE_TEST_DATABASE_ISOLATED src/settlement-job-failure.postgres.test.ts
          sopyo_delivery_validation SOPYO_DELIVERY_TEST_DATABASE_ISOLATED src/sopyo-delivery-poll.postgres.test.ts
          sopyo_order_push_validation SOPYO_ORDER_PUSH_TEST_DATABASE_ISOLATED src/sopyo-order-push-intent.postgres.test.ts
          phase2b_validation PHASE2B_TEST_DATABASE_ISOLATED src/financial-correction-zero-net.postgres.test.ts
          phase2c_bootstrap PHASE2C_TEST_DATABASE_ISOLATED src/financial-correction-paid-debt.postgres.test.ts
          phase2d_validation PHASE2D_TEST_DATABASE_ISOLATED src/financial-correction-paid-credit.postgres.test.ts
          phase2e1_validation PHASE2E1_TEST_DATABASE_ISOLATED src/financial-correction-before-settlement-credit.postgres.test.ts
          phase2e2_validation PHASE2E2_TEST_DATABASE_ISOLATED src/financial-correction-before-settlement-deduction.postgres.test.ts
          phase2e3a_validation PHASE2E3A_TEST_DATABASE_ISOLATED src/financial-correction-approved-settlement-credit.postgres.test.ts
          phase2e3b_validation PHASE2E3B_TEST_DATABASE_ISOLATED src/financial-correction-approved-settlement-deduction.postgres.test.ts
          phase2f1_validation PHASE2F1_TEST_DATABASE_ISOLATED src/financial-correction-draft-payout.postgres.test.ts
          phase2f2_validation PHASE2F2_TEST_DATABASE_ISOLATED src/financial-correction-review-payout.postgres.test.ts
          SUITES

      - name: Build
        run: npm run build

      - name: Mock browser smoke
        run: npm run smoke:browser

      - name: Test
        run: npm run test

      - name: Backend build
        run: npm run backend:build

      - name: Backend typecheck
        run: npm run backend:typecheck

      - name: Backend smoke
        run: npm run backend:smoke
        env:
          SHIPPING_PROVIDER: kargonomi
          KARGONOMI_BASE_URL: http://127.0.0.1:9
          KARGONOMI_API_TOKEN: test-token

      - name: Real Financial Correction browser smokes
        id: real_financial_correction_browser_smokes
        run: npm run smoke:browser:real
        env:
          BROWSER_SMOKE_ALLOW_LOCAL_DB: '1'
          BROWSER_SMOKE_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Upload real browser smoke failure artifacts
        if: failure() && steps.real_financial_correction_browser_smokes.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: financial-correction-browser-smokes
          path: test-results/
          if-no-files-found: warn
          retention-days: 3
