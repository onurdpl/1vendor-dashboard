name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Generate Prisma Client
        # Frontend tests import backend enum-backed services, so generate Prisma before any build/test step.
        run: npm run backend:db:generate

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Backend build
        run: npm run backend:build

      - name: Backend typecheck
        run: npm run backend:typecheck

      - name: Backend smoke
        run: npm run backend:smoke
