name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendor_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendor_dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Generate Prisma Client
        # Frontend tests import backend enum-backed services, so generate Prisma before any build/test step.
        run: npm run backend:db:generate

      - name: Test PostgreSQL advisory lock
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vendor_dashboard_test?schema=public

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Backend build
        run: npm run backend:build

      - name: Backend typecheck
        run: npm run backend:typecheck

      - name: Backend smoke
        run: npm run backend:smoke
        env:
          SHIPPING_PROVIDER: kargonomi
          KARGONOMI_BASE_URL: https://app.kargonomi.com.tr/api/v1
          KARGONOMI_API_TOKEN: test-token
